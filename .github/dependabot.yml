version: 2
updates:
  - package-ecosystem: npm
    directory: /
    labels: ["Type: Maintenance", "Target: Fork"]
    schedule:
      interval: weekly
    # A version becomes a candidate a week after its publication, which leaves
    # time for a compromised or broken release to be found and withdrawn.
    # Security updates are not held back; CONTRIBUTING.md says how to handle
    # an advisory fix.
    cooldown:
      default-days: 7
    groups:
      development:
        dependency-type: development
  # The end-to-end test tools, kept apart from the root package; see #21.
  - package-ecosystem: npm
    directory: /test/e2e
    labels: ["Type: Maintenance", "Target: Fork"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      e2e:
        patterns: ["*"]
    ignore:
      # support/late-requests.ts wraps the Runnable#run of the Mocha that
      # @wdio/mocha-framework runs, and every test fails under another copy.
      # Remove this once @wdio/mocha-framework depends on the new major.
      - dependency-name: "mocha"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /test/e2e
    labels: ["Type: Maintenance", "Target: Fork"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The image's Node.js major version changes with `.nvmrc`, by hand.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    labels: ["Type: Maintenance", "Target: Fork"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
