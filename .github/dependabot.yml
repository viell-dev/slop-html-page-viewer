version: 2
updates:
  - package-ecosystem: npm
    directory: /
    labels: ["Type: Maintenance", "Target: Fork"]
    schedule:
      interval: weekly
    # A version becomes a candidate a week after its publication, which leaves
    # time for a compromised or broken release to be found and withdrawn.
    cooldown:
      default-days: 7
    groups:
      development:
        dependency-type: development
  # The end-to-end test tools, kept apart from the root package; see #21.
  - package-ecosystem: npm
    directory: /test/e2e
    labels: ["Type: Maintenance", "Target: Fork"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      e2e:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /test/e2e
    labels: ["Type: Maintenance", "Target: Fork"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    labels: ["Type: Maintenance", "Target: Fork"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
