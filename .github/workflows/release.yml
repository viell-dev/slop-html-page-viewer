name: Release
# Publishes a version of the plugin as a GitHub release, for installing by
# hand; the fork is not listed in Obsidian's community plugin directory. Run it
# on main after the pull request that sets the version has merged:
#   gh workflow run release.yml -f version=0.2.0-rc.1
# A version with a prerelease part, such as -rc.1, becomes a prerelease.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in manifest.json (without a v prefix)
        required: true
permissions:
  contents: read
# One group per version, so that a pending release of one version is never
# replaced by a dispatch for another.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Check the version
        run: |
          node -e '
            const fs = require("node:fs");
            const version = process.env.VERSION;
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            const problems = [];
            // SemVer 2.0.0 without build metadata, which a tag should not carry.
            const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?$/;
            if (!semver.test(version)) problems.push(`${version} is not a SemVer version`);
            if (manifest.version !== version) problems.push(`manifest.json has ${manifest.version}`);
            if (pkg.version !== version) problems.push(`package.json has ${pkg.version}`);
            if (versions[version] !== manifest.minAppVersion) problems.push("versions.json lacks it");
            if (!fs.existsSync(`.github/release-notes/${version}.md`)) problems.push("no release notes");
            if (problems.length > 0) { console.error(problems.join("\n")); process.exit(1); }
          '
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Package
        run: |
          mkdir -p "release/viell-html-page-viewer"
          cp main.js manifest.json styles.css "release/viell-html-page-viewer/"
          cd release
          # Fixed times make the zip the same on every run, so that a retry of
          # a partly published release matches the checksums already there.
          touch -d "1980-01-01 00:00:00 UTC" viell-html-page-viewer viell-html-page-viewer/*
          TZ=UTC zip -r -X "viell-html-page-viewer-$VERSION.zip" viell-html-page-viewer
          cp viell-html-page-viewer/main.js viell-html-page-viewer/manifest.json viell-html-page-viewer/styles.css .
          sha256sum "viell-html-page-viewer-$VERSION.zip" main.js manifest.json styles.css > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checksums go last, so that they are only there once the rest is.
          assets="release/viell-html-page-viewer-$VERSION.zip release/main.js release/manifest.json release/styles.css release/SHA256SUMS"
          # Claim the version's tag at this commit first. If it exists already,
          # it must point here; any other failure stops the release.
          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA" >/dev/null 2>&1; then
            if ! ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq '.object.type + " " + .object.sha'); then
              echo "Could neither create nor read the tag $VERSION." >&2
              exit 1
            fi
            type=${ref%% *}
            tag=${ref#* }
            if [ "$type" = "tag" ]; then
              tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .object.sha)
            fi
            if [ "$tag" != "$GITHUB_SHA" ]; then
              echo "The tag $VERSION points to $tag, not to $GITHUB_SHA; refusing to publish." >&2
              exit 1
            fi
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Resume a release whose upload stopped part way: add what it lacks.
            existing=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for asset in $assets; do
              if ! printf '%s\n' "$existing" | grep -qxF "$(basename "$asset")"; then
                gh release upload "$VERSION" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            prerelease=""
            case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
            # shellcheck disable=SC2086 # The asset paths have no spaces.
            gh release create "$VERSION" $prerelease \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$VERSION" \
              --notes-file ".github/release-notes/$VERSION.md" \
              $assets
          fi
