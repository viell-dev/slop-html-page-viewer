name: Release
# Publishes a version of the plugin as a GitHub release, for installing by
# hand; the fork is not listed in Obsidian's community plugin directory. Run it
# on main after the pull request that sets the version has merged, and its CI
# on main has passed:
#   gh workflow run release.yml -f version=0.6.0
# With -f dry_run=true it checks, builds, packages, and lists what publishing
# would change, with a read-only token, on any branch. A run that stopped after
# claiming the tag resumes from the tag itself:
#   gh workflow run release.yml --ref 0.6.0 -f version=0.6.0
# RELEASING.md describes the procedure and how to recover when a step fails.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in manifest.json (without a v prefix)
        required: true
      dry_run:
        description: Check, build, and plan only; publish nothing
        type: boolean
        default: false
permissions:
  contents: read
# One group per version, so that a pending release of one version is never
# replaced by a dispatch for another.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  # Everything that decides whether to publish, with a token that cannot.
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Refuse a release from another branch
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' && github.ref != format('refs/tags/{0}', inputs.version) }}
        run: |
          echo "Releases are published from main, or resumed from their tag; $GITHUB_REF can only be dry-run." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check the version
        run: node scripts/release.ts check "$VERSION"
      # The commit's own CI, on Linux, Windows, and in Obsidian, must have
      # passed: the checks that the ruleset for main requires.
      - name: Check the commit's CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.ts verify-ci "$GITHUB_SHA"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Package
        run: node scripts/release.ts package "$VERSION" --out release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.version }}
          path: release
          if-no-files-found: error
          retention-days: 90
          # A rerun of the whole workflow builds the same bytes again.
          overwrite: true
      # The same steps as publishing, against GitHub's current state, changing
      # nothing. This token cannot see draft releases, so a stopped run's
      # draft shows here as missing; the publish job then resumes it.
      - name: Plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.ts publish "$VERSION" --sha "$GITHUB_SHA" --assets release --dry-run

  publish:
    name: publish
    needs: prepare
    if: ${{ !inputs.dry_run && (github.ref == 'refs/heads/main' || github.ref == format('refs/tags/{0}', inputs.version)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The assets that prepare built and checked, never a new build.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ inputs.version }}
          path: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.ts publish "$VERSION" --sha "$GITHUB_SHA" --assets release
      # The files are downloaded as a user downloads them, without a token;
      # the token only reads the release and the tag.
      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.ts verify-published "$VERSION" --sha "$GITHUB_SHA" --assets release
