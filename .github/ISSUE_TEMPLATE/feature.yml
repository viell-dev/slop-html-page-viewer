name: Feature request
description: Propose a new capability or a change in behavior
labels: ["Type: Feature Request"]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I searched the open and closed issues and found no request for this.
          required: true
        - label:
            I follow the project's [code of
            conduct](https://github.com/viell-dev/slop-html-page-viewer/blob/main/CODE_OF_CONDUCT.md).
          required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description:
        The problem you want to solve, with the kind of HTML files you open. Describe the need, not
        only a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What the viewer should do. A small synthetic HTML example helps.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security
      description: >-
        Whether the request changes what a page may do: run scripts, reach Obsidian or the vault, use
        the network, or open other windows. Write "none" if it does not.
    validations:
      required: true
