<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link titles</title>
</head>
<body>
<p>A link and an image inside a shadow root, and SVG links, which show where they lead on hover.</p>
<div id="shadow"><template shadowrootmode="closed"><p><a href="Other%20page.html">Another saved page, from a shadow root</a></p><img src="2026-01-15/figure.png" alt="A green square, in a shadow root" width="64" height="64"></template></div>
<svg width="400" height="48">
<a id="shape" href="https://example.com/shape"><rect width="40" height="40" fill="rgb(46, 125, 50)"/></a>
<a id="legacy" xlink:href="Other%20page.html"><circle cx="80" cy="20" r="20" fill="rgb(21, 101, 192)"/></a>
<a id="text" href="https://example.com/text"><text x="120" y="28">An SVG link with text</text></a>
<a id="own" href="https://example.com/own"><title>The page's own title</title><rect x="340" width="40" height="40" fill="rgb(106, 27, 154)"/></a>
</svg>
</body>
</html>
